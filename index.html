<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misión Matemática: Problemas de Texto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0a0e28;
    --bg-deep2:#0f1440;
    --bg-panel:#161c47;
    --bg-panel2:#1d2456;
    --nebula:#7c4fe0;
    --pink:#ff5da2;
    --cyan:#3fe0d0;
    --yellow:#ffd23f;
    --text:#f5f3ff;
    --text-dim:#aca8d9;
    --ans-red:#ff4d6d;
    --ans-blue:#4d7cff;
    --ans-yellow:#ffd23f;
    --ans-green:#2fe086;
    --ok:#2fe086;
    --bad:#ff4d6d;
    --radius:20px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:radial-gradient(ellipse at 20% -10%, #23205f 0%, var(--bg-deep) 45%), var(--bg-deep);
    color:var(--text);
    font-family:'Nunito',sans-serif;
    overflow-x:hidden;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Baloo 2',sans-serif;
    letter-spacing:.2px;
  }
  #stars{
    position:fixed; inset:0; z-index:0; pointer-events:none;
  }
  #app{
    position:relative; z-index:2;
    max-width:920px;
    margin:0 auto;
    padding:24px 18px 60px;
    min-height:100vh;
  }
  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:22px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-family:'Baloo 2',sans-serif;
    font-weight:700; font-size:1.05rem;
    color:var(--text);
  }
  .brand .rocket-badge{
    width:38px;height:38px;border-radius:50%;
    background:linear-gradient(145deg,var(--nebula),var(--pink));
    display:flex;align-items:center;justify-content:center;
    font-size:1.15rem;
    box-shadow:0 0 0 3px rgba(124,79,224,.25);
  }
  .exit-link{
    background:none;border:1px solid rgba(255,255,255,.18);
    color:var(--text-dim); font-family:'Nunito';font-weight:700;
    padding:8px 14px;border-radius:999px;cursor:pointer;font-size:.85rem;
    transition:.2s;
  }
  .exit-link:hover{border-color:var(--pink); color:var(--pink);}
  /* ---------- Hero / Home ---------- */
  .hero{
    text-align:center; padding:20px 6px 6px;
  }
  .hero .eyebrow{
    display:inline-block;
    font-family:'Nunito';font-weight:800; font-size:.75rem;
    letter-spacing:2px; text-transform:uppercase;
    color:var(--cyan); background:rgba(63,224,208,.1);
    border:1px solid rgba(63,224,208,.35);
    padding:6px 14px;border-radius:999px; margin-bottom:16px;
  }
  .hero h1{
    font-size:clamp(1.9rem,5vw,2.9rem);
    font-weight:800; margin:0 0 12px;
    line-height:1.15;
    background:linear-gradient(90deg,#fff, #cfc7ff 60%, var(--cyan));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero p.sub{
    color:var(--text-dim); font-size:1.05rem; max-width:520px;
    margin:0 auto 26px; line-height:1.55;
  }
  .start-btn{
    font-family:'Baloo 2'; font-weight:700; font-size:1.15rem;
    background:linear-gradient(135deg,var(--pink),var(--nebula));
    color:#fff; border:none; padding:16px 38px; border-radius:999px;
    cursor:pointer; box-shadow:0 10px 30px -8px rgba(255,93,162,.55);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .start-btn:hover{ transform:translateY(-2px) scale(1.02); box-shadow:0 14px 36px -8px rgba(255,93,162,.7);}
  /* ---------- Mission map ---------- */
  .mapwrap{ margin-top:38px; }
  .track{
    position:relative;
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:6px; padding:0 4px; margin-bottom:6px;
  }
  .track::before{
    content:"";
    position:absolute; top:34px; left:6%; right:6%; height:3px;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,.25) 0 10px, transparent 10px 18px);
    z-index:0;
  }
  .planet-node{
    position:relative; z-index:1;
    flex:1; display:flex; flex-direction:column; align-items:center;
    text-align:center; cursor:pointer; background:none; border:none; color:inherit;
    font-family:'Nunito'; padding:0;
  }
  .planet-node[disabled]{cursor:not-allowed;}
  .planet-orb{
    width:68px;height:68px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:1.7rem;
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.35), transparent 55%), var(--orb-color, var(--ans-blue));
    box-shadow:0 0 0 5px rgba(255,255,255,.06), 0 10px 24px -6px rgba(0,0,0,.5);
    transition:transform .2s ease;
    margin-bottom:10px;
  }
  .planet-node:not([disabled]):hover .planet-orb{ transform:translateY(-4px) scale(1.06); }
  .planet-node[disabled] .planet-orb{ filter:grayscale(.7) brightness(.55); }
  .planet-label{ font-weight:800; font-size:.92rem; font-family:'Baloo 2'; }
  .planet-sub{ font-size:.72rem; color:var(--text-dim); max-width:110px; line-height:1.3; margin-top:2px;}
  .stars-earned{ font-size:.78rem; margin-top:4px; letter-spacing:1px; color:var(--yellow); min-height:14px;}
  .lock-note{ font-size:.68rem; color:var(--text-dim); margin-top:4px;}
  .final-node .planet-orb{ background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.35), transparent 55%), linear-gradient(135deg,var(--pink),var(--nebula)); }
  /* ---------- Panel / card ---------- */
  .panel{
    background:linear-gradient(180deg, var(--bg-panel2), var(--bg-panel));
    border:1px solid rgba(255,255,255,.08);
    border-radius:var(--radius);
    padding:26px 24px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,.6);
  }
  .level-header{ display:flex; align-items:center; gap:14px; margin-bottom:18px;}
  .level-header .lvl-icon{
    width:46px;height:46px;border-radius:14px;
    background:var(--lvl-color, var(--ans-blue));
    display:flex;align-items:center;justify-content:center;font-size:1.4rem;
    flex-shrink:0;
  }
  .level-header h2{ margin:0; font-size:1.35rem; }
  .level-header .lh-sub{ color:var(--text-dim); font-size:.85rem; margin-top:2px;}
  /* slide viewer */
  .slide-progress{ display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap;}
  .slide-dot{ width:10px;height:10px;border-radius:50%; background:rgba(255,255,255,.16); transition:.2s;}
  .slide-dot.active{ background:var(--cyan); width:22px; border-radius:6px;}
  .slide-dot.done{ background:var(--ans-green);}
  .slide-card{
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.08);
    border-radius:16px; padding:22px 20px; min-height:220px;
  }
  .slide-card h3{ margin:0 0 12px; font-size:1.25rem; color:#fff;}
  .slide-card p{ line-height:1.65; color:#ddd8fb; font-size:1rem; margin:0 0 14px; white-space:pre-line;}
  .example-box{
    background:rgba(63,224,208,.08); border:1px dashed rgba(63,224,208,.4);
    border-radius:12px; padding:14px 16px; font-size:.92rem; color:#d8fff8;
    white-space:pre-line; line-height:1.55;
  }
  .example-box::before{ content:"🛰️ "; }
  .nav-row{ display:flex; justify-content:space-between; align-items:center; margin-top:20px; gap:10px;}
  .btn{
    font-family:'Baloo 2'; font-weight:700; border:none; border-radius:999px;
    padding:12px 22px; cursor:pointer; font-size:.95rem; transition:.15s ease;
  }
  .btn:disabled{ opacity:.35; cursor:not-allowed;}
  .btn-primary{ background:linear-gradient(135deg,var(--cyan),var(--nebula)); color:#08102b;}
  .btn-primary:hover:not(:disabled){ transform:translateY(-2px); }
  .btn-ghost{ background:rgba(255,255,255,.08); color:var(--text);}
  .btn-ghost:hover:not(:disabled){ background:rgba(255,255,255,.16);}
  .btn-wide{ width:100%; padding:15px; font-size:1.05rem;}
  /* ---------- Quiz ---------- */
  .quiz-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
  .quiz-meta{ font-family:'Baloo 2'; font-weight:700; font-size:.85rem; color:var(--text-dim);}
  .score-chip{
    background:rgba(255,210,63,.12); border:1px solid rgba(255,210,63,.4);
    color:var(--yellow); padding:6px 12px; border-radius:999px; font-weight:800; font-size:.85rem;
    font-family:'Baloo 2';
  }
  .streak-chip{
    background:rgba(255,93,162,.12); border:1px solid rgba(255,93,162,.4);
    color:var(--pink); padding:6px 12px; border-radius:999px; font-weight:800; font-size:.85rem;
    font-family:'Baloo 2'; margin-left:6px;
  }
  .timer-track{ height:8px; border-radius:999px; background:rgba(255,255,255,.08); overflow:hidden; margin-bottom:18px;}
  .timer-fill{ height:100%; background:linear-gradient(90deg,var(--cyan),var(--ans-green)); width:100%; transition:width 1s linear;}
  .timer-fill.warn{ background:linear-gradient(90deg,var(--yellow),var(--ans-red)); }
  .question-box{ text-align:center; margin-bottom:20px;}
  .question-box h3{ font-size:1.2rem; line-height:1.5; margin:0; }
  .answers-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:560px){ .answers-grid{ grid-template-columns:1fr; } }
  .ans-btn{
    display:flex; align-items:center; gap:12px;
    border:none; border-radius:14px; padding:16px 16px;
    font-family:'Nunito'; font-weight:700; font-size:.98rem; text-align:left;
    color:#fff; cursor:pointer; transition:transform .12s ease, filter .12s ease;
    min-height:64px;
  }
  .ans-btn:hover:not(:disabled){ transform:translateY(-2px); filter:brightness(1.08);}
  .ans-btn:disabled{ cursor:default; }
  .ans-shape{ width:26px;height:26px;flex-shrink:0; background:rgba(255,255,255,.9);}
  .shape-triangle{ clip-path:polygon(50% 0%, 0% 100%, 100% 100%);}
  .shape-diamond{ transform:rotate(45deg); border-radius:3px;}
  .shape-circle{ border-radius:50%;}
  .shape-square{ border-radius:5px;}
  .a0{ background:var(--ans-red);}
  .a1{ background:var(--ans-blue);}
  .a2{ background:var(--ans-yellow); color:#241a00;}
  .a3{ background:var(--ans-green); color:#032313;}
  .ans-btn.correct{ outline:3px solid #fff; box-shadow:0 0 0 4px rgba(47,224,134,.5);}
  .ans-btn.wrong{ outline:3px solid #fff; opacity:.55;}
  .feedback{
    margin-top:16px; padding:14px 16px; border-radius:14px; font-size:.92rem; line-height:1.55;
    display:none;
  }
  .feedback.show{ display:block; }
  .feedback.ok{ background:rgba(47,224,134,.12); border:1px solid rgba(47,224,134,.4); color:#d3ffe9;}
  .feedback.bad{ background:rgba(255,77,109,.12); border:1px solid rgba(255,77,109,.4); color:#ffd9df;}
  .feedback strong{ display:block; margin-bottom:4px; font-family:'Baloo 2'; font-size:1rem;}
  /* ---------- Results ---------- */
  .results{ text-align:center; padding:10px 6px; }
  .results .medal{ font-size:3.4rem; margin-bottom:6px; }
  .results h2{ font-size:1.6rem; margin:0 0 6px; }
  .results .score-big{ font-family:'Baloo 2'; font-weight:800; font-size:2.4rem; color:var(--yellow); margin:6px 0;}
  .stars-row{ font-size:1.8rem; letter-spacing:8px; margin:10px 0 18px;}
  .results p.msg{ color:var(--text-dim); max-width:420px; margin:0 auto 24px; line-height:1.6;}
  .results-actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap;}
  footer.note{ text-align:center; color:var(--text-dim); font-size:.78rem; margin-top:34px; opacity:.7;}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="app"></div>

<script>
/* ============================= DATOS ============================= */
const LEVELS = [
{
  id:0, name:"Nivel 1", title:"Plataforma de Lanzamiento",
  subtitle:"Suma, resta, multiplicación y división", icon:"🚀", color:"var(--ans-blue)",
  slides:[
    {title:"¡Bienvenida a la misión!", body:"Un problema de texto matemático es una situación contada con palabras que esconde una operación. Tu trabajo como astronauta-matemática es descubrir qué operación se esconde y resolverla.", example:"Ejemplo: \"Ana tenía 8 estrellas de papel y encontró 5 más. ¿Cuántas tiene ahora?\"\nAquí se esconde una suma: 8 + 5 = 13."},
    {title:"Paso 1: Lee con calma", body:"Antes de hacer cualquier operación, lee el problema completo dos veces. No busques números todavía: primero entiende qué está pasando en la historia.", example:"Tip de tripulación: lee en voz baja, como si le contaras la historia a alguien más."},
    {title:"Paso 2: Subraya los datos", body:"Ahora sí, busca los números y qué representan (unidades: naves, kilómetros, pesos, minutos...). Subráyalos o anótalos aparte.", example:"\"El cohete recorrió 120 km el lunes y 95 km el martes.\"\nDatos: 120 km (lunes), 95 km (martes)."},
    {title:"Paso 3: Encuentra la pregunta", body:"Busca la pregunta, normalmente al final, y suele empezar con \"¿Cuántos...?\", \"¿Cuánto...?\" o \"¿Qué...?\". Esa pregunta te dice exactamente qué debes calcular.", example:"\"¿Cuántos kilómetros recorrió en total?\" → nos piden el TOTAL, es decir, una suma."},
    {title:"Palabras clave de SUMA (+)", body:"Ciertas palabras avisan que hay que sumar: en total, juntos, en conjunto, aumentó, ganó, más que, se unieron.", example:"\"La tripulación tenía 14 galletas espaciales y les regalaron 6 más.\" → 14 + 6"},
    {title:"Palabras clave de RESTA (−)", body:"Estas palabras avisan resta: quedan, perdió, menos que, diferencia, ¿cuánto falta?, disminuyó, se fueron.", example:"\"Había 30 satélites y 12 dejaron de funcionar. ¿Cuántos quedan?\" → 30 − 12"},
    {title:"Palabras clave de MULTIPLICACIÓN (×)", body:"Aparece cuando se repite una misma cantidad varias veces: cada, por, veces, total de grupos iguales.", example:"\"Cada nave lleva 4 astronautas. Hay 6 naves. ¿Cuántos astronautas en total?\" → 6 × 4"},
    {title:"Palabras clave de DIVISIÓN (÷)", body:"Se usa para repartir en partes iguales: repartir, entre, por igual, a cada uno, ¿cuántos grupos?", example:"\"Se reparten 24 muestras lunares entre 6 científicos por igual. ¿Cuántas le tocan a cada uno?\" → 24 ÷ 6"},
    {title:"Paso 4: Plantea y resuelve", body:"Con los datos, la pregunta y la palabra clave, escribe la operación completa y resuélvela paso a paso, sin saltarte cuentas.", example:"\"Un cohete lleva 3 tanques con 150 litros cada uno. ¿Cuántos litros lleva en total?\"\n3 × 150 = 450 litros."},
    {title:"Paso 5: Verifica tu respuesta", body:"Pregúntate: ¿mi respuesta tiene sentido con la historia? ¿Las unidades son correctas? ¡Lista para tu primer reto, astronauta!", example:"Resumen Nivel 1:\nLee → Subraya datos → Encuentra la pregunta → Identifica la palabra clave → Resuelve → Verifica."}
  ],
  quiz:[
    {q:"Un cohete transporta 45 cajas de suministros y luego carga 28 cajas más. ¿Cuántas cajas lleva en total?", options:["63","73","17","83"], correct:1, explain:"45 + 28 = 73. Las palabras \"carga más\" indican suma."},
    {q:"En la estación espacial había 96 raciones de comida. Los astronautas consumieron 39. ¿Cuántas raciones quedan?", options:["57","67","135","47"], correct:0, explain:"96 − 39 = 57. La palabra \"quedan\" indica resta."},
    {q:"Cada módulo de investigación tiene 8 sensores. Hay 7 módulos idénticos. ¿Cuántos sensores hay en total?", options:["48","54","56","63"], correct:2, explain:"8 × 7 = 56. \"Cada\" y \"módulos idénticos\" indican multiplicación."},
    {q:"Se deben repartir 72 muestras de roca lunar entre 9 científicos, en partes iguales. ¿Cuántas muestras recibe cada uno?", options:["9","8","7","81"], correct:1, explain:"72 ÷ 9 = 8. \"Repartir entre... por igual\" indica división."},
    {q:"Una nave recorrió 150 km el lunes y 210 km el martes. ¿Cuántos km recorrió en los dos días?", options:["350","360","370","270"], correct:1, explain:"150 + 210 = 360 km."},
    {q:"Había 240 piezas de un cohete en construcción. Se usaron 185. ¿Cuántas piezas faltan por usar?", options:["45","55","65","155"], correct:1, explain:"240 − 185 = 55 piezas."},
    {q:"Un almacén espacial tiene 6 estantes con 15 cajas cada uno. ¿Cuántas cajas hay en total?", options:["21","90","96","81"], correct:1, explain:"6 × 15 = 90 cajas."},
    {q:"Se reparten 128 galletas espaciales entre 8 astronautas por igual. ¿Cuántas le tocan a cada uno?", options:["14","15","16","18"], correct:2, explain:"128 ÷ 8 = 16 galletas por astronauta."},
    {q:"Ana tenía $320. Compró un telescopio de juguete por $145 y luego un mapa estelar por $60. ¿Cuánto dinero le queda?", options:["$105","$115","$125","$175"], correct:1, explain:"320 − 145 = 175; 175 − 60 = 115."},
    {q:"Un cohete tiene 4 tanques de combustible. Cada tanque contiene 275 litros. ¿Cuántos litros lleva en total?", options:["1080","1100","1175","975"], correct:1, explain:"4 × 275 = 1100 litros."},
    {q:"En una misión participan 108 personas repartidas en equipos de 12 personas cada uno. ¿Cuántos equipos se formaron?", options:["8","9","10","12"], correct:1, explain:"108 ÷ 12 = 9 equipos."},
    {q:"Un robot explorador recorrió 84 metros el primer día. El segundo día recorrió el doble que el primero. ¿Cuántos metros recorrió en total en los dos días?", options:["168","252","336","220"], correct:1, explain:"El doble de 84 es 168. 84 + 168 = 252 metros."}
  ]
},
{
  id:1, name:"Nivel 2", title:"Cinturón de Asteroides",
  subtitle:"Fracciones, decimales y problemas de dos pasos", icon:"☄️", color:"var(--ans-yellow)",
  slides:[
    {title:"Bienvenida al Cinturón de Asteroides", body:"En este nivel los problemas tienen dos pasos y usan fracciones y decimales. Cada asteroide es un reto un poco más complejo: sigue el mismo método, pero con más cuidado.", example:"Consejo: resuelve un paso a la vez y anota los resultados intermedios."},
    {title:"Fracciones: partes de un total", body:"Una fracción representa una parte de algo completo. El número de abajo (denominador) indica en cuántas partes se dividió el total; el de arriba (numerador), cuántas partes tomamos.", example:"\"Un tanque está lleno hasta 3/4 de su capacidad.\"\nSignifica que se dividió en 4 partes iguales y hay 3 llenas."},
    {title:"Fracción de una cantidad", body:"Para calcular una fracción de una cantidad, multiplicas la cantidad por el numerador y divides entre el denominador.", example:"\"¿Cuánto es 3/4 de 120 litros?\"\n→ (120 × 3) ÷ 4 = 90 litros."},
    {title:"Sumar y restar fracciones", body:"Solo puedes sumar o restar fracciones directamente si tienen el mismo denominador.", example:"1/4 + 2/4 = 3/4 (mismo denominador, se suman los numeradores)."},
    {title:"Decimales en problemas cotidianos", body:"Los decimales aparecen mucho en dinero y medidas. Recuerda alinear el punto decimal al sumar o restar.", example:"\"Un traje de juguete cuesta $145.50 y un casco $38.75. ¿Cuánto en total?\"\n→ $145.50 + $38.75 = $184.25"},
    {title:"Problemas de dos pasos", body:"Algunos problemas necesitan más de una operación. Identifica primero qué se calcula en el paso 1, y usa ese resultado para el paso 2.", example:"\"Compraste 3 kits a $80 cada uno y pagaste con $300. ¿Cuánto cambio recibiste?\"\nPaso 1: 3 × 80 = 240. Paso 2: 300 − 240 = 60."},
    {title:"Promedio (media)", body:"El promedio se calcula sumando todos los valores y dividiendo entre cuántos valores hay. Sirve para saber un valor \"típico\".", example:"\"Un explorador recorrió 10, 14 y 12 km en tres días. ¿Cuál fue su promedio diario?\"\n→ (10+14+12) ÷ 3 = 12 km."},
    {title:"Conversión de unidades", body:"A veces debes convertir antes de operar: 1 km = 1000 m, 1 hora = 60 min, 1 kg = 1000 g. Fíjate bien en las unidades del problema y de la respuesta.", example:"\"Un cohete recorre 2.5 km. ¿Cuántos metros son?\"\n→ 2.5 × 1000 = 2500 m."},
    {title:"Ejemplo resuelto completo", body:"\"Un tanque de 800 litros está lleno a 3/4 de su capacidad. Se usan 150 litros en una prueba. ¿Cuántos litros quedan?\"\n\nPaso 1: 3/4 de 800 = 600 litros (llenos).\nPaso 2: 600 − 150 = 450 litros.", example:"Respuesta: quedan 450 litros."},
    {title:"Resumen Nivel 2", body:"Fracción de una cantidad, decimales con cuidado en el punto, problemas de dos pasos en orden, promedio (suma entre cantidad de datos), y conversión de unidades. ¡Lista para el reto del cinturón de asteroides!", example:"Recuerda: un paso a la vez, y verifica las unidades."}
  ],
  quiz:[
    {q:"¿Cuánto es 2/5 de 150 estrellas de papel?", options:["50","60","75","30"], correct:1, explain:"(150 × 2) ÷ 5 = 60."},
    {q:"Un tanque de combustible tiene capacidad de 400 litros y está lleno a 3/8 partes. ¿Cuántos litros contiene?", options:["120","150","175","200"], correct:1, explain:"(400 × 3) ÷ 8 = 150 litros."},
    {q:"Suma 2/6 + 1/6 de una carga de suministros. ¿Qué fracción representa en total?", options:["1/2","1/3","2/3","3/12"], correct:0, explain:"2/6 + 1/6 = 3/6, que simplificado es 1/2."},
    {q:"Un casco espacial de juguete cuesta $128.50 y unos guantes cuestan $45.25. ¿Cuánto pagarás en total?", options:["$173.75","$163.75","$183.25","$172.75"], correct:0, explain:"128.50 + 45.25 = 173.75."},
    {q:"Tenías $350.00 y compraste un mapa estelar de $210.50. ¿Cuánto dinero te queda?", options:["$149.50","$139.50","$129.50","$140.50"], correct:1, explain:"350.00 − 210.50 = 139.50."},
    {q:"Compraste 4 kits de robótica a $65 cada uno y pagaste con un billete de $500. ¿Cuánto cambio recibiste?", options:["$230","$240","$250","$220"], correct:1, explain:"4 × 65 = 260. 500 − 260 = 240."},

/* ============================= STARFIELD ============================= */
(function initStars(){
  const canvas = document.getElementById("stars");
  const ctx = canvas.getContext("2d");
  let w,h,stars=[];
  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    const count = Math.floor((w*h)/9000);
    stars = Array.from({length:count}, ()=>({
      x:Math.random()*w, y:Math.random()*h,
      r:Math.random()*1.4+0.3,
      s:Math.random()*0.02+0.005,
      phase:Math.random()*Math.PI*2
    }));
  }
  function draw(t){
    ctx.clearRect(0,0,w,h);
    for(const st of stars){
      const alpha = 0.35 + 0.5*Math.abs(Math.sin(st.phase + t*st.s));
      ctx.beginPath();
      ctx.fillStyle = "rgba(255,255,255,"+alpha.toFixed(2)+")";
      ctx.arc(st.x, st.y, st.r, 0, Math.PI*2);
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(draw);
})();

/* ============================= HELPERS ============================= */
function starsForScore(score,total){
  const pct = score/total;
  if(pct >= 0.83) return 3;
  if(pct >= 0.58) return 2;
  return 1;
}
function starString(n){
  return "★★★☆☆☆".slice(0,0) + "★".repeat(n) + "☆".repeat(3-n);
}
function clearTimer(){ if(state.timer){ clearInterval(state.timer); state.timer=null; } }

/* ============================= RENDER: QUIZ ============================= */
function startQuiz(levelIndex){
  state.mode = "level";
  state.levelIndex = levelIndex;
  state.quizIndex = 0;
  state.score = 0;
  state.streak = 0;
  renderQuizQuestion();
}
function goToFinalIntro(){
  state.mode = "final";
  state.quizIndex = 0;
  state.score = 0;
  state.streak = 0;
  renderQuizQuestion();
}
function currentQuizData(){
  return state.mode==="final" ? FINAL_QUIZ.quiz : LEVELS[state.levelIndex].quiz;
}
function currentQuizTitle(){
  return state.mode==="final" ? FINAL_QUIZ.title : LEVELS[state.levelIndex].title;
}
function currentQuizIcon(){
  return state.mode==="final" ? "🌌" : LEVELS[state.levelIndex].icon;
}

function renderQuizQuestion(){
  clearTimer();
  state.answered = false;
  state.timeLeft = 20;
  const list = currentQuizData();
  const q = list[state.quizIndex];
  const shapes = ["shape-triangle","shape-diamond","shape-circle","shape-square"];
  app.innerHTML = `
    <div class="topbar">
      <div class="brand"><span class="rocket-badge">${currentQuizIcon()}</span> ${currentQuizTitle()}</div>
      <button class="exit-link" id="exitBtn">Salir</button>
    </div>

          <span class="streak-chip">🔥 ${state.streak}</span>
        </div>

      <div class="answers-grid" id="answersGrid">
        ${q.options.map((opt,i)=>`
          <button class="ans-btn a${i}" data-i="${i}">
            <span class="ans-shape ${shapes[i]}"></span>
            <span>${opt}</span>
          </button>
        `).join("")}
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="nav-row" id="nextRow" style="display:none;">
        <div></div>
        <button class="btn btn-primary" id="nextQBtn">Siguiente pregunta →</button>
      </div>
    </div>
  `;
  document.getElementById("exitBtn").addEventListener("click", ()=>{
    if(confirm("¿Seguro que quieres salir? Perderás el progreso de este reto.")){ renderHome(); }
  });
  document.querySelectorAll(".ans-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>selectAnswer(parseInt(btn.dataset.i)));
  });
  startTimer();
}
function startTimer(){
  const fill = document.getElementById("timerFill");
  updateTimerBar(fill);
  state.timer = setInterval(()=>{
    state.timeLeft -= 1;
    updateTimerBar(fill);
    if(state.timeLeft<=0){
      clearTimer();
      if(!state.answered) selectAnswer(-1);
    }
  },1000);
}
function updateTimerBar(fill){
  if(!fill) return;
  const pct = Math.max(0,(state.timeLeft/20)*100);
  fill.style.width = pct+"%";
  fill.classList.toggle("warn", state.timeLeft<=7);
}
function selectAnswer(i){
  if(state.answered) return;
  state.answered = true;
  clearTimer();
  const list = currentQuizData();
  const q = list[state.quizIndex];
  const buttons = document.querySelectorAll(".ans-btn");
  buttons.forEach(b=>{
    b.disabled = true;
    const bi = parseInt(b.dataset.i);
    if(bi===q.correct) b.classList.add("correct");
    else if(bi===i) b.classList.add("wrong");
  });
  const fb = document.getElementById("feedback");
  const isCorrect = i===q.correct;
  if(isCorrect){
    state.score++;
    state.streak++;
    fb.className = "feedback show ok";
    fb.innerHTML = "<strong>¡Correcto, tripulación! ✅</strong>"+q.explain;
  } else {
    state.streak = 0;
    fb.className = "feedback show bad";
    const prefix = i===-1 ? "⏱️ ¡Se acabó el tiempo!" : "Casi, revisa esto:";
    fb.innerHTML = "<strong>"+prefix+"</strong>"+q.explain;
  }
  document.getElementById("nextRow").style.display = "flex";
  const list2 = currentQuizData();
  const isLastQ = state.quizIndex === list2.length-1;
  const nextBtn = document.getElementById("nextQBtn");
  nextBtn.textContent = isLastQ ? "Ver resultados 🏁" : "Siguiente pregunta →";
  nextBtn.addEventListener("click", ()=>{
    if(isLastQ){ finishQuiz(); }
    else { state.quizIndex++; renderQuizQuestion(); }
  });
}

/* ============================= RENDER: RESULTS ============================= */
function finishQuiz(){
  clearTimer();
  if(state.mode==="final"){
    state.finalDone = true;
    state.finalBestScore = Math.max(state.finalBestScore, state.score);
    renderFinalResults();
  } else {
    const total = LEVELS[state.levelIndex].quiz.length;
    const st = starsForScore(state.score,total);
    state.completed[state.levelIndex] = true;
    state.bestStars[state.levelIndex] = Math.max(state.bestStars[state.levelIndex], st);
    renderLevelResults(st);
  }
}

  else msg = "Buen intento. Vuelve a repasar las tarjetas de "+lv.title+" y vuelve a intentarlo cuando quieras.";
  app.innerHTML = `
    <div class="topbar">
      <div class="brand"><span class="rocket-badge">${lv.icon}</span> ${lv.name}</div>
      <div></div>
    </div>
    <div class="panel results">
      <div class="medal">${starsCount===3?"🏆":starsCount===2?"🥈":"🛰️"}</div>
      <h2>${lv.title} — ¡completado!</h2>
      <div class="score-big">${state.score} / ${total}</div>
      <div class="stars-row">${starString(starsCount)}</div>
      <p class="msg">${msg}</p>
      <div class="results-actions">
        <button class="btn btn-ghost" id="retryBtn">Repetir reto</button>
        <button class="btn btn-ghost" id="reviewBtn">Repasar tarjetas</button>
        ${nextUnlocked?'<button class="btn btn-primary" id="nextLevelBtn">Siguiente planeta →</button>':'<button class="btn btn-primary" id="goFinalBtn">Ir a la práctica final →</button>'}
      </div>
    </div>
  `;
  document.getElementById("retryBtn").addEventListener("click", ()=>startQuiz(state.levelIndex));
  document.getElementById("reviewBtn").addEventListener("click", ()=>goToLevelIntro(state.levelIndex));
  if(nextUnlocked){
    document.getElementById("nextLevelBtn").addEventListener("click", ()=>goToLevelIntro(state.levelIndex+1));
  } else {
    document.getElementById("goFinalBtn").addEventListener("click", goToFinalIntro);
  }
}
function renderFinalResults(){
  const total = FINAL_QUIZ.quiz.length;
  const pct = state.score/total;
  let medal, msg;
  if(pct>=0.85){ medal="🏆"; msg="¡Misión de reentrada perfecta! Dominas los problemas de texto de los tres niveles."; }
  else if(pct>=0.6){ medal="🥈"; msg="¡Muy buen resultado! Repasa los temas donde fallaste y vuelve a intentarlo cuando quieras."; }
  else { medal="🛰️"; msg="Buen esfuerzo, astronauta. Repasa los niveles y vuelve a intentar la simulación final."; }
  app.innerHTML = `
    <div class="topbar">
      <div class="brand"><span class="rocket-badge">🌌</span> ${FINAL_QUIZ.title}</div>
      <div></div>
    </div>
    <div class="panel results">
      <div class="medal">${medal}</div>
      <h2>Misión completa</h2>
      <div class="score-big">${state.score} / ${total}</div>
      <p class="msg">${msg}</p>
      <div class="results-actions">
        <button class="btn btn-ghost" id="retryFinalBtn">Repetir simulación</button>
        <button class="btn btn-primary" id="homeBtn">Volver al mapa de misión</button>
      </div>
    </div>
  `;
  document.getElementById("retryFinalBtn").addEventListener("click", goToFinalIntro);
  document.getElementById("homeBtn").addEventListener("click", renderHome);
}

/* ============================= INICIO ============================= */
renderHome();
</script>
</body>
</html>
