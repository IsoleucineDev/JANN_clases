<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Misión Espacial · Lectura de Gráficos 🚀</title>
<style>
:root{
  --morado:#6C3CE0;
  --morado-osc:#2B1854;
  --amarillo:#FFD23F;
  --verde:#3CCB7F;
  --rosa:#FF6FA5;
  --azul:#3EC6FF;
  --naranja:#FF8C42;
  --crema:#FFF8EC;
  --texto:#241246;
  --rojo:#FF5A5F;
  --k-red:#E21B3C;
  --k-blue:#1368CE;
  --k-gold:#D89E00;
  --k-green:#26890C;
  --sombra: 0 8px 0 rgba(0,0,0,0.25);
  --font: 'Baloo 2','Comic Sans MS','Segoe UI Rounded','Trebuchet MS',sans-serif;
}
*{box-sizing:border-box;}
html,body{
  margin:0;padding:0;height:100%;
  font-family:var(--font);
  background:linear-gradient(160deg,#3A1F6B 0%, #21123F 50%, #0A0620 100%);
  color:var(--texto);
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
body::before{
  content:"";
  position:fixed;inset:0;
  background-image:
    radial-gradient(2px 2px at 10% 20%, #ffffffaa 50%, transparent 51%),
    radial-gradient(2px 2px at 80% 10%, #ffffff88 50%, transparent 51%),
    radial-gradient(3px 3px at 60% 70%, #ffffff66 50%, transparent 51%),
    radial-gradient(2px 2px at 30% 80%, #ffffff99 50%, transparent 51%),
    radial-gradient(2px 2px at 90% 60%, #ffffff77 50%, transparent 51%),
    radial-gradient(2px 2px at 45% 40%, #ffffff55 50%, transparent 51%),
    radial-gradient(2px 2px at 15% 55%, #ffffff77 50%, transparent 51%),
    radial-gradient(2px 2px at 70% 85%, #ffffff55 50%, transparent 51%);
  background-size:100% 100%;
  animation: twinkle 4s ease-in-out infinite alternate;
  pointer-events:none;
  z-index:0;
}
@keyframes twinkle{ from{opacity:.55;} to{opacity:1;} }

.planet{position:fixed;border-radius:50%;pointer-events:none;z-index:0;animation: floatPlanet 7s ease-in-out infinite;}
.planet.p1{width:120px;height:120px;top:8%;left:-40px;background:radial-gradient(circle at 35% 30%, #FF8C42, #B5501B 70%);box-shadow:0 0 40px rgba(255,140,66,0.35);}
.planet.p2{width:70px;height:70px;bottom:12%;right:-15px;background:radial-gradient(circle at 35% 30%, #3EC6FF, #1D6E9C 70%);box-shadow:0 0 30px rgba(62,198,255,0.35);animation-delay:1.5s;}
.planet.p3{width:46px;height:46px;top:20%;right:8%;background:radial-gradient(circle at 35% 30%, #FFD23F, #C99900 70%);box-shadow:0 0 20px rgba(255,210,63,0.4);animation-delay:.8s;}
@keyframes floatPlanet{0%,100%{transform:translateY(0);}50%{transform:translateY(-18px);}}

button{font-family:var(--font);cursor:pointer;}
h1,h2,h3,p{margin:0;}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;}

#topbar{display:none;align-items:center;gap:14px;padding:14px 18px;background:rgba(0,0,0,0.22);backdrop-filter:blur(4px);position:relative;z-index:5;}
#topbar.show{display:flex;}
.btn-back{background:var(--crema);border:none;border-radius:16px;width:52px;height:52px;font-size:24px;box-shadow:var(--sombra);flex-shrink:0;transition:transform .1s;}
.btn-back:active{transform:translateY(6px);box-shadow:none;}
.progress-outer{flex:1;background:rgba(255,255,255,0.2);border-radius:20px;height:22px;overflow:hidden;border:2px solid rgba(255,255,255,0.35);position:relative;}
.progress-inner{height:100%;background:linear-gradient(90deg,var(--azul),var(--verde));width:0%;border-radius:20px;transition:width .4s ease;position:relative;}
.progress-inner::after{content:"🚀";position:absolute;right:-4px;top:50%;transform:translateY(-50%);font-size:18px;}
#hud-stats{display:flex;gap:10px;color:#fff;font-weight:700;font-size:15px;flex-shrink:0;white-space:nowrap;}
#hud-stats span{background:rgba(255,255,255,0.16);padding:6px 10px;border-radius:12px;}

.screen{display:none;flex:1;flex-direction:column;align-items:center;padding:20px;animation:fadeIn .35s ease;position:relative;z-index:2;}
.screen.active{display:flex;}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

#screen-home{justify-content:center;text-align:center;gap:20px;}
.home-title{color:#fff;font-size:42px;font-weight:800;text-shadow:0 4px 0 rgba(0,0,0,0.3);letter-spacing:1px;}
.home-sub{color:var(--amarillo);font-size:19px;font-weight:700;margin-top:-5px;}
.home-buttons{display:grid;grid-template-columns:repeat(2, 1fr);gap:16px;max-width:560px;width:100%;margin-top:10px;}
@media(max-width:500px){.home-buttons{grid-template-columns:1fr;}}
.big-btn{border:none;border-radius:22px;padding:22px 18px;font-size:20px;font-weight:800;color:#fff;box-shadow:0 8px 0 rgba(0,0,0,0.3);transition:transform .12s, box-shadow .12s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
.big-btn:active{transform:translateY(8px);box-shadow:0 0 0 rgba(0,0,0,0.3);}
.big-btn .btn-sub{font-size:13px;font-weight:600;opacity:0.9;}
.big-btn.clase{background:linear-gradient(145deg,var(--azul),#1D6E9C);}
.big-btn.diag{background:linear-gradient(145deg,var(--rosa),#C73870);}
.big-btn.inter{background:linear-gradient(145deg,var(--naranja),#B5501B);}
.big-btn.avan{background:linear-gradient(145deg,var(--morado),var(--morado-osc));}

.home-note{color:#C9B8F5;font-size:13px;max-width:480px;font-weight:600;}
.difficulty-strip{display:flex;gap:8px;margin-top:2px;}
.diff-chip{padding:6px 14px;border-radius:16px;font-size:12px;font-weight:800;color:#fff;}
.diff-chip.b{background:var(--verde);}
.diff-chip.i{background:var(--amarillo);color:var(--morado-osc);}
.diff-chip.a{background:var(--rojo);}

#mascot-wrap{position:fixed;bottom:14px;left:14px;display:flex;align-items:flex-end;gap:10px;z-index:50;pointer-events:none;}
.mascot-helmet{width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #ffffff, #cfe8ff 55%, #9fc9f2 100%);display:flex;align-items:center;justify-content:center;font-size:50px;box-shadow:0 0 0 6px rgba(62,198,255,0.55), 0 8px 14px rgba(0,0,0,0.4);animation:bounce 2.2s ease-in-out infinite;}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-14px) rotate(3deg);}}
#speech{background:var(--crema);border-radius:18px 18px 18px 4px;padding:10px 16px;font-weight:700;font-size:15px;max-width:220px;box-shadow:var(--sombra);opacity:0;transform:scale(0.7);transition:all .25s cubic-bezier(.34,1.56,.64,1);}
#speech.show{opacity:1;transform:scale(1);}

.card{background:var(--crema);border-radius:26px;padding:26px;box-shadow:var(--sombra);width:100%;max-width:640px;}
.pill{display:inline-block;background:var(--amarillo);color:var(--morado-osc);padding:6px 16px;border-radius:20px;font-weight:800;font-size:14px;margin-bottom:8px;}
.pill.diffpill{margin-left:8px;}
.pill.diffpill.b{background:var(--verde);color:#fff;}
.pill.diffpill.i{background:var(--amarillo);color:var(--morado-osc);}
.pill.diffpill.a{background:var(--rojo);color:#fff;}

#screen-slides{gap:16px;width:100%;}
.slide-card{width:100%;max-width:680px;background:var(--crema);border-radius:28px;padding:30px;box-shadow:var(--sombra);text-align:center;min-height:400px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;}
.slide-title{font-size:27px;font-weight:800;color:var(--morado);}
.slide-sub{font-size:15.5px;color:#5B4A78;font-weight:600;}
.slide-visual{margin:10px 0;display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%;}
.slide-nav{display:flex;gap:16px;margin-top:16px;width:100%;max-width:680px;justify-content:space-between;}
.nav-btn{border:none;border-radius:18px;padding:16px 26px;font-size:17px;font-weight:800;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,0.25);transition:transform .1s;}
.nav-btn:active{transform:translateY(6px);box-shadow:none;}
.nav-btn.prev{background:#9b8bbf;}
.nav-btn.next{background:var(--verde);}
.nav-btn:disabled{opacity:0.35;pointer-events:none;}
.dots{display:flex;gap:8px;justify-content:center;}
.dot{width:12px;height:12px;border-radius:50%;background:#4a3a6b;}
.dot.active{background:var(--rosa);transform:scale(1.3);}

.label-tag{font-size:13px;font-weight:700;color:#fff;background:var(--morado);padding:6px 12px;border-radius:10px;}
.mini-reto{background:#eee7fb;border-radius:18px;padding:16px;width:100%;}
.mini-reto-opts{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap;}
.mini-opt{border:none;border-radius:14px;padding:12px 20px;font-size:16px;font-weight:800;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,0.15);color:var(--morado);}
.mini-feedback{margin-top:10px;font-weight:800;min-height:24px;}

.step-row{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;max-width:440px;}
.step-item{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:14px;padding:10px 14px;}
.step-num{width:30px;height:30px;border-radius:50%;background:var(--morado);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;}
.step-text{font-size:13.5px;font-weight:600;color:#4a3a6b;}

.chart-wrap{background:#fff;border-radius:16px;padding:10px;box-shadow:0 4px 10px rgba(0,0,0,0.12);}
.dual-chart{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.dual-chart .lab{font-size:11px;font-weight:800;color:var(--morado);text-align:center;margin-bottom:4px;}

#screen-exercise{gap:16px;width:100%;}
.exercise-header{color:#fff;text-align:center;}
.exercise-header .tema-label{font-size:16px;font-weight:700;opacity:.9;letter-spacing:.5px;}
.exercise-header .streak{font-size:15px;color:var(--amarillo);font-weight:800;}
.q-card{width:100%;max-width:680px;text-align:center;}
.q-visual{margin:12px 0;display:flex;justify-content:center;gap:16px;flex-wrap:wrap;}
.q-text{font-size:21px;font-weight:800;color:var(--morado);line-height:1.35;}
.options{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px;}
@media(max-width:560px){.options{grid-template-columns:1fr;}}
.opt-btn{border:none;border-radius:16px;padding:18px 14px;font-size:17px;font-weight:800;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,0.25);transition:transform .1s, box-shadow .1s;display:flex;align-items:center;gap:10px;justify-content:flex-start;text-align:left;}
.opt-btn .shape{font-size:20px;flex-shrink:0;}
.opt-btn:active{transform:translateY(6px);box-shadow:none;}
.opt-btn.k0{background:var(--k-red);}
.opt-btn.k1{background:var(--k-blue);}
.opt-btn.k2{background:var(--k-gold);}
.opt-btn.k3{background:var(--k-green);}
.opt-btn.correct{outline:4px solid #fff;animation:pop .4s;}
.opt-btn.wrong{filter:brightness(0.65);animation:shake .4s;}
.opt-btn.dim{opacity:.45;}
@keyframes pop{0%{transform:scale(1);}50%{transform:scale(1.06);}100%{transform:scale(1);}}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}

.feedback-box{margin-top:16px;padding:14px 18px;border-radius:16px;font-weight:700;font-size:15px;display:none;text-align:left;}
.feedback-box.show{display:block;animation:fadeIn .3s;}
.feedback-box.ok{background:#d8f7e6;color:#1f7a49;}
.feedback-box.bad{background:#ffe1e2;color:#a13438;}

.btn-siguiente{margin-top:16px;border:none;border-radius:18px;padding:16px 30px;font-size:18px;font-weight:800;background:var(--amarillo);color:var(--morado-osc);box-shadow:0 6px 0 #c99f1e;display:none;}
.btn-siguiente.show{display:inline-block;}
.btn-siguiente:active{transform:translateY(6px);box-shadow:none;}

.interstitial{justify-content:center;align-items:center;text-align:center;gap:20px;}
.interstitial .emoji-big{font-size:86px;animation:bounce 1.6s ease-in-out infinite;}
.interstitial h2{color:#fff;font-size:30px;}
.interstitial p{color:var(--amarillo);font-size:17px;font-weight:700;max-width:480px;}

#screen-results{justify-content:center;align-items:center;text-align:center;gap:14px;}
.medal{font-size:96px;animation:medalPop .6s cubic-bezier(.34,1.56,.64,1);}
@keyframes medalPop{0%{transform:scale(0) rotate(-30deg);}100%{transform:scale(1) rotate(0);}}
.result-title{color:#fff;font-size:32px;font-weight:800;}
.result-pct{font-size:58px;font-weight:900;color:var(--amarillo);text-shadow:0 3px 0 rgba(0,0,0,.3);}
.result-stats{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px;}
.result-stats .stat{background:rgba(255,255,255,.15);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;min-width:110px;}
.result-msg{color:#fff;font-size:17px;font-weight:700;max-width:500px;}
.btn-replay{margin-top:10px;border:none;border-radius:20px;padding:20px 34px;font-size:21px;font-weight:800;background:linear-gradient(145deg,var(--verde),#1f9c58);color:#fff;box-shadow:0 8px 0 rgba(0,0,0,0.3);}
.btn-replay:active{transform:translateY(8px);box-shadow:none;}

#confetti-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:200;}
.confetti-piece{position:absolute;top:-20px;width:10px;height:16px;opacity:0.95;animation-name:confettiFall;animation-timing-function:ease-in;animation-fill-mode:forwards;}
@keyframes confettiFall{from{transform:translateY(-10vh) rotate(0deg);}to{transform:translateY(110vh) rotate(680deg);}}
.star-burst{position:absolute;font-size:22px;animation:starBurst .8s ease-out forwards;pointer-events:none;}
@keyframes starBurst{0%{transform:translate(0,0) scale(0.3);opacity:1;}100%{transform:translate(var(--sx),var(--sy)) scale(1.3);opacity:0;}}

@media(max-width:600px){
  .home-title{font-size:30px;}
  .big-btn{font-size:17px;padding:18px 12px;}
  .q-text{font-size:17px;}
  .slide-title{font-size:21px;}
  .mascot-helmet{width:64px;height:64px;font-size:36px;}
  #speech{font-size:12.5px;max-width:150px;}
}
</style>
</head>
<body>
<div id="app">
  <div class="planet p1"></div>
  <div class="planet p2"></div>
  <div class="planet p3"></div>
  <div id="confetti-layer"></div>

  <div id="topbar">
    <button class="btn-back" onclick="goHome()">⬅️</button>
    <div class="progress-outer"><div class="progress-inner" id="progress-bar"></div></div>
    <div id="hud-stats"></div>
  </div>

  <main id="main">

    <section id="screen-home" class="screen active">
      <h1 class="home-title">🚀 Misión: Lectura de Gráficos 🐱</h1>
      <p class="home-sub">📊 Elige tu desafío de evaluación</p>
      <div class="difficulty-strip">
        <span class="diff-chip b">BÁSICO</span>
        <span class="diff-chip i">INTERMEDIO</span>
        <span class="diff-chip a">AVANZADO</span>
      </div>
      <div class="home-buttons">
        <button class="big-btn clase" onclick="startClase()">
          📚 Clase
          <span class="btn-sub">Aprende paso a paso</span>
        </button>
        <button class="big-btn diag" onclick="startModo('diagnostico')">
          📋 Diagnóstico
          <span class="btn-sub">20 Preguntas Básicas</span>
        </button>
        <button class="big-btn inter" onclick="startModo('intermedio')">
          ⚙️ Intermedio
          <span class="btn-sub">30 Preguntas Retadoras</span>
        </button>
        <button class="big-btn avan" onclick="startModo('avanzado')">
          🔥 Avanzado
          <span class="btn-sub">20 Preguntas Nivel Máster</span>
        </button>
      </div>
      <p class="home-note">¡Demuestra tus habilidades estadísticas, gatonauta! Selecciona un modo para comenzar tu misión. ✨</p>
    </section>

    <section id="screen-slides" class="screen">
      <div class="slide-card" id="slide-card"></div>
      <div class="dots" id="slide-dots"></div>
      <div class="slide-nav">
        <button class="nav-btn prev" id="slide-prev" onclick="prevSlide()">⬅️ Anterior</button>
        <button class="nav-btn next" id="slide-next" onclick="nextSlide()">Siguiente ➡️</button>
      </div>
    </section>

    <section id="screen-exercise" class="screen">
      <div class="exercise-header">
        <div class="tema-label" id="exercise-tema-label">📊 GRÁFICOS</div>
        <div class="streak" id="exercise-streak">🔥 Racha: 0</div>
      </div>
      <div class="card q-card">
        <div class="pill" id="q-counter">Pregunta 1</div>
        <span class="pill diffpill" id="q-diffpill"></span>
        <div class="q-text" id="q-text"></div>
        <div class="q-visual" id="q-visual"></div>
        <div class="options" id="q-options"></div>
        <div class="feedback-box" id="q-feedback"></div>
        <button class="btn-siguiente" id="btn-siguiente" onclick="nextQuestion()">Siguiente ➡️</button>
      </div>
    </section>

    <section id="screen-inter" class="screen interstitial">
      <div class="emoji-big" id="inter-emoji">🎉</div>
      <h2 id="inter-title"></h2>
      <p id="inter-sub"></p>
      <button class="nav-btn next" onclick="interContinue()">Continuar ➡️</button>
    </section>

    <section id="screen-results" class="screen">
      <div class="medal" id="result-medal">🥇</div>
      <div class="result-title" id="result-title">¡Resultados!</div>
      <div class="result-pct" id="result-pct">0%</div>
      <div class="result-stats" id="result-stats"></div>
      <p class="result-msg" id="result-msg"></p>
      <button class="btn-replay" onclick="goHome()">🔄 Volver a la base</button>
    </section>

  </main>

  <div id="mascot-wrap">
    <div id="speech"></div>
    <div class="mascot-helmet" id="mascot">🐱</div>
  </div>
</div>

<script>
/* 1. UTILIDADES */
function rnd(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[rnd(0,arr.length-1)]; }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; }

const COLORS_CONFETTI=['#FF6FA5','#FFD23F','#3CCB7F','#3EC6FF','#FF8C42','#B48CF2'];
function launchConfetti(n){
  n=n||40; const layer=document.getElementById('confetti-layer');
  for(let i=0;i<n;i++){
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.left=rnd(0,100)+'vw'; p.style.background=pick(COLORS_CONFETTI);
    p.style.animationDuration=(rnd(22,38)/10)+'s'; p.style.borderRadius=Math.random()>0.5?'50%':'3px';
    layer.appendChild(p); setTimeout(()=>p.remove(),4200);
  }
}
function starBurstAt(x,y,count){
  count=count||8; const layer=document.getElementById('confetti-layer');
  for(let i=0;i<count;i++){
    const s=document.createElement('div'); s.className='star-burst'; s.textContent=pick(['⭐','✨','🌟']);
    s.style.left=x+'px'; s.style.top=y+'px';
    const ang=Math.random()*Math.PI*2, dist=rnd(40,110);
    s.style.setProperty('--sx',Math.cos(ang)*dist+'px'); s.style.setProperty('--sy',Math.sin(ang)*dist+'px');
    layer.appendChild(s); setTimeout(()=>s.remove(),850);
  }
}

/* 2. SONIDOS */
let audioCtx=null;
function ensureAudio(){ if(!audioCtx){ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); } if(audioCtx.state==='suspended') audioCtx.resume(); }
function playTone(freq,duration,type,delay,vol){
  ensureAudio(); type=type||'sine'; delay=delay||0; vol=vol===undefined?0.2:vol;
  const t=audioCtx.currentTime+delay; const osc=audioCtx.createOscillator(); const gain=audioCtx.createGain();
  osc.type=type; osc.frequency.setValueAtTime(freq,t); gain.gain.setValueAtTime(vol,t);
  gain.gain.exponentialRampToValueAtTime(0.001,t+duration);
  osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t+duration+0.02);
}
function playClick(){ playTone(520,0.08,'triangle',0,0.15); }
function playCorrect(){ playTone(523.25,0.14,'sine',0,0.22); playTone(659.25,0.14,'sine',0.1,0.22); playTone(783.99,0.22,'sine',0.2,0.24); }
function playWrong(){ playTone(220,0.22,'sawtooth',0,0.16); playTone(160,0.28,'sawtooth',0.12,0.16); }
function playFanfare(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>playTone(f,0.3,'square',i*0.15,0.15)); }

/* 3. MASCOTA */
const MSG_BIENVENIDA=["¡Hola! Soy Astrogato 🐱🚀","¿Listo para leer gráficos como un experto?","¡Prepárate para despegar! 🚀"];
const MSG_CORRECTO=["¡Directo a las estrellas! ⭐","¡Lectura perfecta! 🚀","¡Eres un gran gatonauta! 🐱","¡Excelente, sigue así! 🌟","¡Análisis de nivel experto! ✨","¡Increíble! 🌌"];

/* 5. GENERADORES VISUALES */
function niceMaxFor(values){
  const max=Math.max(...values);
  if(max<=5) return 5;
  const step=Math.pow(10, Math.floor(Math.log10(max)));
  return Math.ceil(max/step)*step;
}
function makeBarSVG(labels, values, color, opts){
  opts = opts||{};
  const w=320,h=230, padL=34, padR=10, padT=26, padB=36;
  const niceMax = opts.niceMax || niceMaxFor(values);
  const baseline = opts.baseline || 0;
  const chartW=w-padL-padR, chartH=h-padT-padB;
  const gap=chartW/labels.length; const barW=gap*0.6;
  let bars='',labelsSvg='',valuesSvg='',grid='';
  for(let g=0; g<=4; g++){
    const gy = padT + chartH - (chartH*g/4);
    grid += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${w-padR}" y2="${gy.toFixed(1)}" stroke="#e6def7" stroke-width="1"/>`;
  }
  labels.forEach((lab,i)=>{
    const v=values[i];
    const frac = Math.max(0,(v-baseline))/(niceMax-baseline);
    const barH = frac*chartH;
    const x=padL+i*gap+(gap-barW)/2;
    const y=padT+chartH-barH;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" fill="${color}" rx="5"/>`;
    valuesSvg += `<text x="${(x+barW/2).toFixed(1)}" y="${(y-6).toFixed(1)}" font-size="12" font-weight="700" fill="#241246" text-anchor="middle">${v}</text>`;
    labelsSvg += `<text x="${(x+barW/2).toFixed(1)}" y="${h-16}" font-size="11" fill="#6C3CE0" font-weight="700" text-anchor="middle">${lab}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:320px;background:#fff;border-radius:14px;">
    ${grid}<line x1="${padL}" y1="${padT+chartH}" x2="${w-padR}" y2="${padT+chartH}" stroke="#6C3CE0" stroke-width="1.5"/>
    ${bars}${valuesSvg}${labelsSvg}</svg>`;
}
function makeGroupedBarSVG(labels, valuesA, valuesB, colorA, colorB, nameA, nameB){
  const w=340,h=240, padL=34, padR=10, padT=26, padB=44;
  const niceMax = niceMaxFor([...valuesA,...valuesB]);
  const chartW=w-padL-padR, chartH=h-padT-padB;
  const gap=chartW/labels.length; const barW=gap*0.32;
  let bars='',labelsSvg='',valuesSvg='',grid='';
  for(let g=0; g<=4; g++){
    const gy=padT+chartH-(chartH*g/4);
    grid += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${w-padR}" y2="${gy.toFixed(1)}" stroke="#e6def7" stroke-width="1"/>`;
  }
  labels.forEach((lab,i)=>{
    const vA=valuesA[i], vB=valuesB[i];
    const hA=(vA/niceMax)*chartH, hB=(vB/niceMax)*chartH;
    const xBase=padL+i*gap+(gap-barW*2-4)/2;
    const yA=padT+chartH-hA, yB=padT+chartH-hB;
    bars += `<rect x="${xBase.toFixed(1)}" y="${yA.toFixed(1)}" width="${barW.toFixed(1)}" height="${hA.toFixed(1)}" fill="${colorA}" rx="4"/>`;
    bars += `<rect x="${(xBase+barW+4).toFixed(1)}" y="${yB.toFixed(1)}" width="${barW.toFixed(1)}" height="${hB.toFixed(1)}" fill="${colorB}" rx="4"/>`;
    valuesSvg += `<text x="${(xBase+barW/2).toFixed(1)}" y="${(yA-5).toFixed(1)}" font-size="10.5" font-weight="700" fill="#241246" text-anchor="middle">${vA}</text>`;
    valuesSvg += `<text x="${(xBase+barW+4+barW/2).toFixed(1)}" y="${(yB-5).toFixed(1)}" font-size="10.5" font-weight="700" fill="#241246" text-anchor="middle">${vB}</text>`;
    labelsSvg += `<text x="${(xBase+barW+2).toFixed(1)}" y="${h-24}" font-size="11" fill="#6C3CE0" font-weight="700" text-anchor="middle">${lab}</text>`;
  });
  const legend = `<rect x="${padL}" y="${h-16}" width="10" height="10" fill="${colorA}" rx="2"/>
    <text x="${padL+14}" y="${h-7}" font-size="10" fill="#241246">${nameA}</text>
    <rect x="${padL+70}" y="${h-16}" width="10" height="10" fill="${colorB}" rx="2"/>
    <text x="${padL+84}" y="${h-7}" font-size="10" fill="#241246">${nameB}</text>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:340px;background:#fff;border-radius:14px;">
    ${grid}<line x1="${padL}" y1="${padT+chartH}" x2="${w-padR}" y2="${padT+chartH}" stroke="#6C3CE0" stroke-width="1.5"/>
    ${bars}${valuesSvg}${labelsSvg}${legend}</svg>`;
}
function makeLineSVG(labels, values, color){
  const w=320,h=230, padL=34, padR=14, padT=26, padB=36;
  const niceMax = niceMaxFor(values);
  const chartW=w-padL-padR, chartH=h-padT-padB;
  const gap = labels.length>1 ? chartW/(labels.length-1) : 0;
  let grid='';
  for(let g=0; g<=4; g++){
    const gy=padT+chartH-(chartH*g/4);
    grid += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${w-padR}" y2="${gy.toFixed(1)}" stroke="#e6def7" stroke-width="1"/>`;
  }
  const pts = values.map((v,i)=>{ const x=padL+i*gap; const y=padT+chartH-(v/niceMax)*chartH; return [x,y]; });
  const polyline = pts.map(p=>p.join(',')).join(' ');
  let dots='',valuesSvg='',labelsSvg='';
  pts.forEach((p,i)=>{
    dots += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="5" fill="${color}"/>`;
    valuesSvg += `<text x="${p[0].toFixed(1)}" y="${(p[1]-10).toFixed(1)}" font-size="12" font-weight="700" fill="#241246" text-anchor="middle">${values[i]}</text>`;
    labelsSvg += `<text x="${p[0].toFixed(1)}" y="${h-16}" font-size="11" fill="#6C3CE0" font-weight="700" text-anchor="middle">${labels[i]}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:320px;background:#fff;border-radius:14px;">
    ${grid}<line x1="${padL}" y1="${padT+chartH}" x2="${w-padR}" y2="${padT+chartH}" stroke="#6C3CE0" stroke-width="1.5"/>
    <polyline points="${polyline}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}${valuesSvg}${labelsSvg}</svg>`;
}
function makeMisleadingPairSVG(labA, valA, labB, valB, truncatedSide){
  const niceMax = niceMaxFor([valA,valB]);
  const minV = Math.min(valA,valB);
  const truncBaseline = Math.max(0, minV - Math.max(2, Math.round(minV*0.08)));
  const honest = makeBarSVG([labA,labB],[valA,valB], "#6C3CE0", {baseline:0, niceMax});
  const misleading = makeBarSVG([labA,labB],[valA,valB], "#E8555A", {baseline:truncBaseline, niceMax:Math.max(valA,valB)});
  const left = truncatedSide==='left' ? misleading : honest;
  const right = truncatedSide==='left' ? honest : misleading;
  const leftLab = truncatedSide==='left' ? "Gráfico A (eje recortado)" : "Gráfico A (eje desde 0)";
  const rightLab = truncatedSide==='left' ? "Gráfico B (eje desde 0)" : "Gráfico B (eje recortado)";
  return `<div class="dual-chart">
    <div><div class="lab">${leftLab}</div>${left}</div>
    <div><div class="lab">${rightLab}</div>${right}</div>
  </div>`;
}

let slideIdx=0;
function startClase(){
  playClick(); slideIdx=0; renderSlide(); showScreen('screen-slides');
  mascotSay("¡Atención a la lección! 📖");
}
function renderSlide(){
  const s=SLIDES_GRAFICOS[slideIdx];
  document.getElementById('slide-card').innerHTML=`
    <div class="slide-title">${s.title}</div>
    <div class="slide-sub">${s.sub}</div>
    <div class="slide-visual">${s.visual}</div>
    ${s.extra}`;
  document.getElementById('slide-dots').innerHTML=SLIDES_GRAFICOS.map((_,i)=>`<div class="dot ${i===slideIdx?'active':''}"></div>`).join('');
  document.getElementById('slide-prev').disabled=(slideIdx===0);
  document.getElementById('slide-next').textContent=(slideIdx===SLIDES_GRAFICOS.length-1)?"Terminar 🚀":"Siguiente ➡️";
  setProgress(((slideIdx+1)/SLIDES_GRAFICOS.length)*100);
}
function prevSlide(){ playClick(); if(slideIdx>0){ slideIdx--; renderSlide(); } }
function nextSlide(){
  playClick();
  if(slideIdx < SLIDES_GRAFICOS.length-1){ slideIdx++; renderSlide(); }
  else { goHome(); mascotSay("¡Excelente! Ahora demuestra lo aprendido 🚀"); }
}
function miniCheck(btn, isOk){
  const fb = document.getElementById('mini-feedback');
  if(isOk){
    fb.style.color="#1f7a49"; fb.textContent="¡Correcto! Hace parecer los cambios mucho mayores. ✨";
    playCorrect(); launchConfetti(20);
  } else {
    fb.style.color="#a13438"; fb.textContent="¡Incorrecto! Al no iniciar en 0, distorsiona la proporción visual.";
    playWrong();
  }
}

/* 8. LÓGICA DE EJERCICIOS Y MODOS */
let currentMode = ""; // 'diagnostico', 'intermedio', 'avanzado'
let questionBank = [];
let currentQIdx = 0;
let score = 0;
let streak = 0;

function startModo(modo){
  playClick();
  currentMode = modo;
  currentQIdx = 0;
  score = 0;
  streak = 0;
  
  if(modo === 'diagnostico'){
    questionBank = shuffle(QUESTIONS_DIAGNOSTICO).slice(0,20);
    document.getElementById('exercise-tema-label').textContent = "📋 DIAGNÓSTICO BÁSICO (20 PREGUNTAS)";
  } else if(modo === 'intermedio'){
    questionBank = shuffle(QUESTIONS_INTERMEDIO).slice(0,30);
    document.getElementById('exercise-tema-label').textContent = "⚙️ NIVEL INTERMEDIO (30 PREGUNTAS)";
  } else if(modo === 'avanzado'){
    questionBank = shuffle(QUESTIONS_AVANZADO).slice(0,20);
    document.getElementById('exercise-tema-label').textContent = "🔥 NIVEL AVANZADO (20 PREGUNTAS)";
  }
  
  showScreen('screen-exercise');
  renderQuestion();
}

function renderQuestion(){
  const q = questionBank[currentQIdx];
  const total = questionBank.length;
  
  setProgress(((currentQIdx) / total) * 100);
  setHud(`<span>❓ ${currentQIdx + 1}/${total}</span> <span>⭐ Puntos: ${score}</span>`);
  
  document.getElementById('exercise-streak').textContent = `🔥 Racha: ${streak}`;
  document.getElementById('q-counter').textContent = `Pregunta ${currentQIdx + 1} de ${total}`;
  
  const diffPill = document.getElementById('q-diffpill');
  if(q.diff === 'b'){ diffPill.textContent = "BÁSICO"; diffPill.className = "pill diffpill b"; }
  else if(q.diff === 'i'){ diffPill.textContent = "INTERMEDIO"; diffPill.className = "pill diffpill i"; }
  else { diffPill.textContent = "AVANZADO"; diffPill.className = "pill diffpill a"; }
  
  document.getElementById('q-text').textContent = q.q;
  
  const visContainer = document.getElementById('q-visual');
  visContainer.innerHTML = q.vis ? q.vis() : '';
  
  const optsContainer = document.getElementById('q-options');
  optsContainer.innerHTML = '';
  
  const shapes = ['▲','■','●','✦'];
  q.opts.forEach((optText, i) => {
    const btn = document.createElement('button');
    btn.className = `opt-btn k${i}`;
    btn.innerHTML = `<span class="shape">${shapes[i]}</span> <span>${optText}</span>`;
    btn.onclick = (e) => checkAnswer(i, e);
    optsContainer.appendChild(btn);
  });
  
  const fb = document.getElementById('q-feedback');
  fb.className = 'feedback-box';
  fb.style.display = 'none';
  
  const nextBtn = document.getElementById('btn-siguiente');
  nextBtn.classList.remove('show');
}

function checkAnswer(selectedIdx, evt){
  const q = questionBank[currentQIdx];
  const buttons = document.querySelectorAll('.opt-btn');
  buttons.forEach(b => b.onclick = null);
  
  const fb = document.getElementById('q-feedback');
  fb.classList.add('show');
  
  if(selectedIdx === q.correct){
    playCorrect();
    buttons[selectedIdx].classList.add('correct');
    buttons.forEach((b,i) => { if(i !== selectedIdx) b.classList.add('dim'); });
    
    score += 10;
    streak++;
    
    if(evt) starBurstAt(evt.clientX, evt.clientY, 8);
    if(streak % 5 === 0) launchConfetti(30);
    
    fb.classList.add('ok');
    fb.innerHTML = `<b>¡Correcto! 🎉</b><br>${q.exp}`;
    mascotSay(pick(MSG_CORRECTO));
  } else {
    playWrong();
    buttons[selectedIdx].classList.add('wrong');
    buttons[q.correct].classList.add('correct');
    buttons.forEach((b,i) => { if(i !== selectedIdx && i !== q.correct) b.classList.add('dim'); });
    
    streak = 0;
    fb.classList.add('bad');
    fb.innerHTML = `<b>¡Casi! 🛰️</b><br>${q.exp}`;
    mascotSay(pick(MSG_INCORRECTO));
  }
  
  document.getElementById('exercise-streak').textContent = `🔥 Racha: ${streak}`;
  setHud(`<span>❓ ${currentQIdx + 1}/${questionBank.length}</span> <span>⭐ Puntos: ${score}</span>`);
  
  document.getElementById('btn-siguiente').classList.add('show');
}

function nextQuestion(){
  playClick();
  currentQIdx++;
  if(currentQIdx < questionBank.length){
    renderQuestion();
  } else {
    finishQuiz();
  }
}

function finishQuiz(){
  setProgress(100);
  const total = questionBank.length;
  const maxScore = total * 10;
  const pct = Math.round((score / maxScore) * 100);
  
  document.getElementById('result-pct').textContent = `${pct}%`;
  document.getElementById('result-stats').innerHTML = `
    <div class="stat">🎯 Aciertos: ${score/10}/${total}</div>
    <div class="stat">⭐ Puntos: ${score}</div>
  `;
  
  let medal = "🥉";
  let title = "¡Misión Completada!";
  let msg = "¡Sigue practicando para dominar todos los gráficos!";
  
  if(pct >= 90){
    medal = "🏆";
    title = "¡Excelente Trabajo, Gatonauta!";
    msg = "¡Has demostrado un dominio magistral de la lectura de gráficos!";
    playFanfare();
    launchConfetti(80);
  } else if(pct >= 70){
    medal = "🥇";
    title = "¡Muy Buen Desempeño!";
    msg = "Tienes bases sólidas. ¡Un par de repasos más y serás invencible!";
    playFanfare();
    launchConfetti(50);
  } else if(pct >= 50){
    medal = "🥈";
    title = "¡Buen Intento!";
    msg = "Vas por buen camino. Revisa los conceptos que te fallaron.";
  } else {
    playWrong();
  }
  
  document.getElementById('result-medal').textContent = medal;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-msg').textContent = msg;
  
  showScreen('screen-results');
}

function interContinue(){
  playClick();
  showScreen('screen-exercise');
}
</script>
